<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>secretslist</title>
    <link rel="icon" type="image/x-icon" href="Art/favicon.ico?v=heart" />
    <meta name="darkreader-lock" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .secrets-wrap {
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
      }
      .secrets-wrap h1 {
        font-family: var(--ui-font);
        font-size: 1.4em;
      }
      .secret-entry {
        border: 1px solid #333;
        padding: 15px;
        margin-top: 15px;
        background: #0a0a0a;
      }
      .secret-entry h2 {
        margin: 0 0 8px 0;
        font-size: 1em;
        font-family: var(--ui-font);
        color: var(--accent-color);
      }
      .secret-entry p {
        margin: 0;
        color: #aaa;
        font-size: 0.9em;
      }
      .back-link {
        color: #666;
        font-size: 0.85em;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="secrets-wrap">
      <a class="back-link" href="index.html">&lt; back</a>
      <h1>secretslist</h1>

      <div class="secret-entry">
        <h2>1. combined mode</h2>
        <p>
          the VS in the middle of the arena does something if you click it
          three times fast.
        </p>
      </div>

      <div class="secret-entry">
        <h2>2. hidden tracks</h2>
        <p>
          settings has a ??? button. it opens a controller. old cheat codes
          still work.
        </p>
      </div>
    </div>
    <script src="cursor.js"></script>
  </body>
</html>
