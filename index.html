<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune Song Ranker - Rank Your Favorites</title>
    <meta name="description"
        content="Rank every song in the Deltarune soundtrack with this simple, interactive tool. Discover your favorites and share your list with friends.">
    <link rel="icon" type="image/x-icon" href="Art/favicon.ico">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://stavros-alt.github.io/drSongRanker/">
    <meta property="og:title" content="Deltarune Song Ranker">
    <meta property="og:description" content="Which Deltarune song is the best? Rank them all here!">
    <meta property="og:image" content="https://stavros-alt.github.io/drSongRanker/Art/funGang.jpeg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://stavros-alt.github.io/drSongRanker/">
    <meta property="twitter:title" content="Deltarune Song Ranker">
    <meta property="twitter:description"
        content="Rank every song in the Deltarune soundtrack. No tier lists, just choices.">
    <meta property="twitter:image" content="https://stavros-alt.github.io/drSongRanker/Art/funGang.jpeg">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
</head>

<body>
    <div id="stats-bar">
        <span id="visitor-stat">VISITORS: ...</span>
        <span id="vote-stat">TOTAL VOTES: ...</span>
        <span id="personal-vote-stat" style="color: var(--accent-color);">YOUR VOTES: 0</span>
    </div>
    <div class="main-container">
        <div class="arena-container">
            <h1>Which song is better?</h1>
            <div class="arena">
                <div id="songA-card" class="song-card">
                    <h2 id="songA-name"></h2>
                    <button class="preview-btn" data-song="A">Play Preview</button>
                </div>
                <div class="vs">VS</div>
                <div id="songB-card" class="song-card">
                    <h2 id="songB-name"></h2>
                    <button class="preview-btn" data-song="B">Play Preview</button>
                </div>
            </div>
            <div class="choices">
                <button id="chooseA-btn" class="choice-btn">Choose A</button>
                <button id="tie-btn" class="choice-btn">Tie / Skip</button>
                <button id="chooseB-btn" class="choice-btn">Choose B</button>
            </div>
            <div id="progress-container">
                <div id="progress-bar"></div>
                <div id="progress-text"></div>
            </div>
            <div class="controls">
                <a href="https://ko-fi.com/stavros916" target="_blank" rel="noopener noreferrer" id="kofi-link">
                    <button id="kofi-btn">Support (Ko-fi)</button>
                </a>

                <button id="toggle-rankings-btn" class="choice-btn">Show Rankings</button>
                <button id="reset-btn">Reset Data</button>
            </div>
        </div>

        <div class="ranking-container">
            <div class="ranking-header">
                <button id="my-ranking-btn" class="ranking-toggle-btn active">My Rank</button>
                <button id="community-ranking-btn" class="ranking-toggle-btn">Global</button>
            </div>

            <div class="filter-tabs">
                <button class="filter-btn active" data-chapter="all">All</button>
                <button class="filter-btn" data-chapter="1">Ch.1</button>
                <button class="filter-btn" data-chapter="2">Ch.2</button>
                <button class="filter-btn" data-chapter="3">Ch.3</button>
                <button class="filter-btn" data-chapter="4">Ch.4</button>
            </div>

            <div class="ranking-actions">
                <button id="play-list-btn" class="action-btn">Play This List</button>
                <button id="share-btn" class="action-btn">Share Ranking</button>
            </div>

            <ul id="ranking-list">
                <!-- Rankings will be populated here -->
            </ul>
        </div>
    </div>

    <!-- Music Player Bar -->
    <div id="music-player-bar" class="hidden">
        <div class="player-info">
            <span id="player-song-name">Now Playing...</span>
        </div>
        <div class="player-controls">
            <button id="player-prev-btn">⏮</button>
            <button id="player-play-btn">⏯</button>
            <button id="player-next-btn">⏭</button>
            <button id="player-close-btn">✖</button>
        </div>
        <audio id="playlist-audio"></audio>
    </div>

    <!-- Share Modal -->
    <div id="share-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center;">
        <div
            style="background: #000; border: 4px solid #fff; padding: 30px; max-width: 500px; width: 90%; text-align: center; position: relative; box-shadow: 10px 10px 0 rgba(50,0,50,0.5);">
            <h2
                style="margin-top: 0; font-family: 'Roboto Mono', monospace; color: #fff; text-transform: uppercase; border-bottom: 2px solid #fff; padding-bottom: 10px;">
                My Top Songs</h2>
            <div id="share-preview"
                style="background: #000; padding: 25px; border: 2px solid #333; margin-bottom: 25px; text-align: left; font-family: 'Roboto Mono', monospace;">
                <!-- Content injected by JS -->
            </div>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button id="download-share-btn"
                    style="border: 2px solid #fff; background: #000; color: #fff; padding: 10px 20px; font-family: 'Roboto Mono'; cursor: pointer;">DOWNLOAD
                    IMAGE</button>
                <button id="close-share-btn"
                    style="border: 2px solid #666; background: #000; color: #888; padding: 10px 20px; font-family: 'Roboto Mono'; cursor: pointer;">CLOSE</button>
            </div>
        </div>
    </div>

    <audio id="audioA"></audio>
    <audio id="audioB"></audio>

    <div id="easter-egg-container"></div>

    <footer>
        <p class="credits">
            Fan Project. Music & IP © Toby Fox.
        </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="app_song_data.js"></script>
    <script src="app.js"></script>
</body>

</html>
