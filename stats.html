<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune Ranker - Stats Dashboard</title>
    <link rel="icon" type="image/x-icon" href="Art/favicon.ico">
    <meta name="darkreader-lock">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .stats-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-flow: dense;
            /* Fill gaps automatically */
            gap: 20px;
            margin-top: 30px;
        }

        .col-span-2 {
            grid-column: span 2;
        }

        .col-span-3 {
            grid-column: span 3;
        }

        @media (max-width: 900px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }

            .col-span-2,
            .col-span-3 {
                grid-column: auto;
            }
        }

        .chart-card {
            background: #000;
            border: 2px solid #fff;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 400px;
            /* Fixed height */
        }

        .chart-container {
            flex-grow: 1;
            min-height: 0;
            position: relative;
            width: 100%;
        }

        .chart-card h2 {
            margin-top: 0;
            border-bottom: 1px solid #fff;
            padding-bottom: 10px;
            margin-bottom: 10px;
            /* Reduced margin */
            font-size: 1.2em;
            flex-shrink: 0;
            /* Don't shrink the title */
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>
    <div class="stats-container">
        <h1>Global Stats Dashboard</h1>
        <p>Private Analytics View</p>

        <div class="chart-grid">
            <!-- Row 1 -->


            <div class="chart-card">
                <h2>Top 10 Highest Rated</h2>
                <div class="chart-container">
                    <canvas id="votesChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Bottom 10 Lowest Rated</h2>
                <div class="chart-container">
                    <canvas id="bottom10Chart"></canvas>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="chart-card col-span-2">
                <h2>Rating Distribution</h2>
                <div class="chart-container">
                    <canvas id="ratingDistChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Average Rating by Chapter</h2>
                <div class="chart-container">
                    <canvas id="chapterChart"></canvas>
                </div>
            </div>

            <!-- Row 3 -->
            <div class="chart-card col-span-3">
                <h2>The Curve (All Songs Sorted)</h2>
                <div class="chart-container">
                    <canvas id="curveChart"></canvas>
                </div>
            </div>

            <!-- Row 4 -->
            <div class="chart-card col-span-2">
                <h2>Chronological Quality (ID vs Rating)</h2>
                <div class="chart-container">
                    <canvas id="chronoChart"></canvas>
                </div>
            </div>

            <!-- Standard Deviation -->
            <div class="chart-card">
                <h2>Controversy Index (Std Dev)</h2>
                <div
                    style="display: flex; justify-content: center; align-items: center; height: 100%; font-size: 4em; font-weight: bold; color: var(--accent-color);">
                    <span id="stdDevDisplay">...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="app_song_data.js"></script>
    <script src="cursor.js"></script>
    <script src="stats.js"></script>
</body>

</html>
